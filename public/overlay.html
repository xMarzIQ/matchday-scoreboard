<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard overlay</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/scoreboard.css">
<style>
  /* Add this page to OBS as a Browser source at 1920×1080. Everything but the scoreboard is see-through. */
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  .viewport { position: fixed; inset: 0; overflow: hidden; }
</style>
</head>
<body>
<div class="viewport" id="viewport"></div>
<script src="/match.js"></script>
<script src="/scoreboard.js"></script>
<script>
  const board = Scoreboard.mount(document.getElementById('viewport'));
  Scoreboard.listen({ onState: (state) => board.render(state) });
</script>
</body>
</html>
